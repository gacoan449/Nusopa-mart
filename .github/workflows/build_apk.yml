name: "Otomatis Build APK Nusopa Mart"

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: "Membangun File APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "Setup Flutter Environment"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      - name: "Regenerate Android Project Folder"
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan. Membangun ulang struktur android..."
            flutter create . --platforms=android
          else
            echo "Folder android ditemukan, melanjutkan ke proses berikutnya."
          fi

      - name: "Sanitize and Force Write Clean main.dart"
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_messaging/firebase_messaging.dart'; 
          import 'auth_screen.dart';
          import 'main_navigation.dart';
          import 'services/notifikasi_service.dart'; 

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            
            await Firebase.initializeApp(
              options: const FirebaseOptions(
                apiKey: "AIzaSyB-guTai42pYgcvXeacyt_8fyUpkfxzluA",
                appId: "1:242778852239:android:c046739230c32971fe99fa", 
                messagingSenderId: "242778852239",
                projectId: "desapay-10614",
                storageBucket: "desapay-10614.firebasestorage.app",
              ),
            );

            await NotifikasiService.inisialisasiNotifikasi();
            
            try {
              await FirebaseMessaging.instance.subscribeToTopic("nusopa_promo");
            } catch (e) {
              debugPrint("Gagal subscribe topik: $e");
            }

            runApp(const NusopaMartApp());
          }

          class NusopaMartApp extends StatelessWidget {
            const NusopaMartApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Nusopa Mart',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.orange.shade800,
                    primary: Colors.orange.shade800,
                  ),
                  useMaterial3: true,
                  scaffoldBackgroundColor: Colors.grey.shade50,
                ),
                home: StreamBuilder<User?>(
                  stream: FirebaseAuth.instance.authStateChanges(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const Scaffold(
                        body: Center(
                          child: CircularProgressIndicator(color: Colors.orange),
                        ),
                      );
                    }
                    if (snapshot.hasData && snapshot.data != null) {
                      return const MainNavigation();
                    }
                    return const AuthScreen();
                  },
                ),
              );
            }
          }
          EOF

      - name: "Sanitize and Force Write Clean auth_screen.dart"
        run: |
          cat << 'EOF' > lib/auth_screen.dart
          import 'package:flutter/material.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final FirebaseAuth _auth = FirebaseAuth.instance;
            final FirebaseFirestore _firestore = FirebaseFirestore.instance;

            final _formKey = GlobalKey<FormState>();
            final TextEditingController _emailController = TextEditingController();
            final TextEditingController _passwordController = TextEditingController();
            final TextEditingController _namaController = TextEditingController();
            final TextEditingController _namaTokoController = TextEditingController();

            bool isLoginMode = true; 
            bool isLoading = false;
            bool _sembunyikanPassword = true; 
            String _roleDipilih = 'buyer'; 

            @override
            void dispose() {
              _emailController.dispose();
              _passwordController.dispose();
              _namaController.dispose();
              _namaTokoController.dispose();
              super.dispose();
            }

            void _submitAuth() async {
              if (!_formKey.currentState!.validate()) return;

              setState(() {
                isLoading = true;
              });

              try {
                if (isLoginMode) {
                  await _auth.signInWithEmailAndPassword(
                    email: _emailController.text.trim(),
                    password: _passwordController.text.trim(),
                  );
                } else {
                  UserCredential userCredential = await _auth.createUserWithEmailAndPassword(
                    email: _emailController.text.trim(),
                    password: _passwordController.text.trim(),
                  );

                  Map<String, dynamic> dataUser = {
                    'uid': userCredential.user!.uid,
                    'nama': _namaController.text.trim(),
                    'email': _emailController.text.trim(),
                    'role': _roleDipilih,
                    'buat_pada': Timestamp.now(),
                  };

                  if (_roleDipilih == 'seller') {
                    dataUser['nama_toko'] = _namaTokoController.text.trim();
                    dataUser['kuota_tiket'] = 0; 
                    dataUser['kota_seller'] = 'Belum diatur'; 
                  }

                  await _firestore.collection('users').doc(userCredential.user!.uid).set(dataUser);
                }
              } on FirebaseAuthException catch (e) {
                String errorMessage = "Terjadi kesalahan sistem. Coba beberapa saat lagi.";
                if (e.code == 'invalid-credential') {
                  errorMessage = 'Email atau kata sandi yang Anda masukkan salah.';
                } else if (e.code == 'email-already-in-use') {
                  errorMessage = 'Email ini sudah terdaftar. Silakan login.';
                } else if (e.code == 'weak-password') {
                  errorMessage = 'Kata sandi terlalu lemah (Minimal gunakan 6 karakter).';
                }
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(backgroundColor: Colors.red.shade800, content: Text(errorMessage)),
                  );
                }
              } finally {
                if (mounted) {
                  setState(() {
                    isLoading = false;
                  });
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                      colors: [Colors.orange.shade800, Colors.orange.shade600],
                    ),
                  ),
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(20.0),
                      child: Card(
                        elevation: 4,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 24),
                          child: Form(
                            key: _formKey,
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                CircleAvatar(
                                  radius: 30,
                                  backgroundColor: Colors.orange.shade50,
                                  child: Icon(Icons.local_mall, size: 35, color: Colors.orange.shade800),
                                ),
                                const SizedBox(height: 12),
                                Text(
                                  isLoginMode ? 'Masuk ke Nusopa' : 'Gabung Mitra Nusopa',
                                  style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.orange.shade900),
                                ),
                                const SizedBox(height: 24),
                                if (!isLoginMode) ...[
                                  TextFormField(
                                    controller: _namaController,
                                    decoration: InputDecoration(
                                      labelText: 'Nama Lengkap',
                                      prefixIcon: const Icon(Icons.person_outline, size: 20),
                                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(8)),
                                    ),
