name: Nusopa.Mart Auto Build APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Merakit APK Nusopa Mart di Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Source Code dari Repo
        uses: actions/checkout@v4

      - name: Konfigurasi Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # PERBAIKAN DI SINI: Menggunakan repositori pembuat yang benar
      - name: Konfigurasi Mesin SDK Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Mengunduh Dependency Library
        run: flutter pub get

      - name: Proses Perakitan APK Rilis Final
        run: flutter build apk --release

      - name: Unggah Hasil APK ke Dashboard GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
