import 'package:flutter/material.dart';
import 'package:google_fonts/google_fonts.dart';
import 'package:firebase_core/firebase_core.dart'; // Mengaktifkan Firebase Cloud internet
import 'screens/login_screen.dart'; // Memanggil halaman login nyata

void main() async {
  // Wajib dipanggil sebelum menyalakan Firebase di Flutter
  WidgetsFlutterBinding.ensureInitialized();
  
  // Mengaktifkan koneksi database Firebase Cloud secara nyata
  await Firebase.initializeApp();
  
  runApp(const NusopaMartApp());
}

class NusopaMartApp extends StatelessWidget {
  const NusopaMartApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Nusopa.Mart',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        useMaterial3: true,
        primaryColor: const Color(0xFFFF5722), // Warna Oranye Premium Nusopa
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFFFF5722),
          primary: const Color(0xFFFF5722),
        ),
        // Mengubah seluruh font aplikasi menjadi Inter agar mewah dan tidak kaku
        textTheme: GoogleFonts.interTextTheme(Theme.of(context).textTheme),
        scaffoldBackgroundColor: const Color(0xFFF8F9FA), // Latar abu-abu sangat muda premium
      ),
      // PINTU UTAMA MEWAH: Langsung masuk ke halaman Login Data Nyata Firebase
      home: const LoginScreen(),
    );
  }
}
