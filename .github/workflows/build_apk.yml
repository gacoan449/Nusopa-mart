name: Nusopa.Mart Auto Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # IMPORTANT: Keep the repository Android project intact.
      # Do NOT run `flutter create` here because it would regenerate the
      # applicationId and break the Firebase Google Services match.
      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/google-services.json
          grep -q '"package_name": "Nusopa.mart"' android/app/google-services.json
          grep -q "applicationId 'Nusopa.mart'" android/app/build.gradle
          grep -q "namespace 'Nusopa.mart'" android/app/build.gradle
          echo 'Firebase/Android package configuration is consistent: Nusopa.mart'

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/build.gradle
          test -f android/app/build.gradle
          grep -q "com.android.application.*8.6.1" android/build.gradle
          grep -q "com.google.gms.google-services.*4.4.2" android/build.gradle
          grep -q "id 'com.google.gms.google-services'" android/app/build.gradle
          echo 'Android Gradle configuration verified.'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
