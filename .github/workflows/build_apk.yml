name: Nusopa.Mart Auto Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      # IMPORTANT: Do not delete/recreate android/. The previous workflow did
      # this and flutter create generated applicationId com.example.nusopa_mart,
      # which did not match the Firebase Android client com.example.desapay.
      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/google-services.json
          grep -q '"package_name": "com.example.desapay"' android/app/google-services.json
          grep -q "applicationId 'com.example.desapay'" android/app/build.gradle
          grep -q "namespace 'com.example.desapay'" android/app/build.gradle
          echo 'Firebase/Android package configuration is consistent.'

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/build.gradle
          test -f android/app/build.gradle
          grep -q "com.android.application.*8.6.1" android/build.gradle
          grep -q "com.google.gms.google-services.*4.4.2" android/build.gradle
          grep -q "id 'com.google.gms.google-services'" android/app/build.gradle
          echo 'Android Gradle configuration verified.'

      - name: Verify Android v2 embedding only
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'io\.flutter\.app\.|FlutterActivityDelegate|FlutterActivityEvents|FlutterApplication|FlutterPlayStoreSplitApplication|FlutterPluginRegistry|io\.flutter\.embedding\.engine\.plugins\.shim|io\.flutter\.view\.' android --include='*.java' --include='*.kt' --include='*.xml'; then
            echo 'Forbidden Android v1 embedding API reference detected.'
            exit 1
          fi
          echo 'Android v2 embedding verification passed.'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
