name: Nusopa.Mart Auto Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Recreate Android host with current Flutter template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nusopa
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/nusopa/google-services.json; fi
          rm -rf android
          flutter create --platforms=android --org com.example --project-name nusopa_mart .
          if [ -f /tmp/nusopa/google-services.json ]; then cp /tmp/nusopa/google-services.json android/app/google-services.json; fi
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f android/app/src/main/kotlin/com/example/nusopa_mart/MainActivity.kt

      - name: Enable Google Services in generated Gradle project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          app = Path('android/app/build.gradle.kts')
          if not settings.exists() or not app.exists(): raise SystemExit('Modern Kotlin DSL Gradle files were not generated.')
          s = settings.read_text()
          if 'com.google.gms.google-services' not in s:
              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
              settings.write_text(s)
          s = app.read_text()
          if 'com.google.gms.google-services' not in s:
              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
              app.write_text(s)
          PY

      - name: Verify Android v2 embedding only
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'io\.flutter\.app\.|FlutterActivityDelegate|FlutterActivityEvents|FlutterApplication|FlutterFragmentActivity|FlutterPlayStoreSplitApplication|FlutterPluginRegistry|io\.flutter\.embedding\.engine\.plugins\.shim|io\.flutter\.view\.' android --include='*.java' --include='*.kt' --include='*.xml'; then
            echo 'Forbidden Android v1 embedding API reference detected.'
            exit 1
          fi
          grep -RIn 'io\.flutter\.embedding\.android\.FlutterActivity' android --include='*.kt' --include='*.java' || true
          echo 'Android v2 embedding verification passed.'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
