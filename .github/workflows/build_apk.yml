name: "Otomatis Build APK Nusopa Mart"

# Workflow ini akan berjalan otomatis setiap kali Anda melakukan PUSH ke cabang 'main' atau 'master'
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: "Membangun File APK"
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode proyek Anda dari repositori GitHub
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # 2. Memasang Java Keperluan Kompilasi Android (Gunakan versi 17 yang sangat stabil untuk Flutter terbaru)
      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Memasang Lingkungan Kerja Flutter di Server GitHub
      - name: "Setup Flutter Environment"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Mengaktifkan cache agar proses build berikutnya berjalan jauh lebih cepat

      # 4. Mengunduh semua pustaka dependencies dari pubspec.yaml
      - name: "Install Dependencies"
        run: flutter pub get

      # 5. Merakit Ikon Logo Aplikasi secara Otomatis di Server (Sesuai pubspec.yaml Anda)
      - name: "Generate Launcher Icons"
        run: flutter pub run flutter_launcher_icons

      # 6. Proses Utama: Merakit File APK Versi Rilis (Release Mode)
      - name: "Build Release APK"
        run: flutter build apk --release

      # 7. Mempublikasikan Hasil APK Jadi secara Otomatis ke Tab Releases GitHub Anda
      - name: "Upload APK ke GitHub Releases"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Nusopa Mart APK v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 🎉 APK Sukses Dibuat Otomatis Oleh Server GitHub!
            
            Silakan unduh file `app-release.apk` di bawah untuk mencoba aplikasi di HP Android Anda.
            
            **Detail Riwayat Pembaruan:**
            - Sinkronisasi Logo Ikon Sukses.
            - Fitur Radius Jarak GPS Aktif.
            - Sistem Tiket Seller Aman.
            - Notifikasi Tanpa Suara Standar Sistem.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
