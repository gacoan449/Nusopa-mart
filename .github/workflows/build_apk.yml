name: Nusopa.Mart Auto Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify modern Flutter Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/Nusopa/mart/MainActivity.kt
          test -f android/app/google-services.json
          grep -q 'dev.flutter.flutter-plugin-loader' android/settings.gradle
          grep -q 'includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")' android/settings.gradle
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          grep -q 'flutter {' android/app/build.gradle
          grep -q 'source "../.."' android/app/build.gradle
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/kotlin/Nusopa/mart/MainActivity.kt
          grep -q 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name="flutterEmbedding"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:value="2"' android/app/src/main/AndroidManifest.xml

      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"package_name": "Nusopa.mart"' android/app/google-services.json
          grep -q 'applicationId "Nusopa.mart"' android/app/build.gradle
          grep -q 'namespace "Nusopa.mart"' android/app/build.gradle

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id "com.android.application" version "8.9.1" apply false' android/settings.gradle
          grep -q "id 'com.android.application' version '8.9.1' apply false" android/build.gradle
          grep -q 'com.google.gms.google-services.*4.4.2' android/settings.gradle
          grep -q 'id "com.google.gms.google-services"' android/app/build.gradle
          grep -q 'compileSdk 36' android/app/build.gradle
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type all
          fi
          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.11.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle toolchain
        working-directory: android
        run: ./gradlew --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
