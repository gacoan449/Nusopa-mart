name: "Otomatis Build APK Nusopa Mart"

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: "Membangun File APK"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Java JDK"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "Setup Flutter Environment"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true 

      # TENTARA PENYELAMAT: Membuat ulang folder android/ secara otomatis & bersih jika tidak ada di GitHub
      - name: "Regenerate Android Project Folder"
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan. Membangun ulang struktur android..."
            flutter create . --platforms=android
          else
            echo "Folder android ditemukan, melanjutkan ke proses berikutnya."
          fi

      - name: "Install Dependencies"
        run: flutter pub get

      # Proses ini sekarang dijamin sukses karena AndroidManifest.xml sudah dibuat otomatis oleh langkah di atas
      - name: "Generate Launcher Icons"
        run: flutter pub run flutter_launcher_icons

      - name: "Build Release APK"
        run: flutter build apk --release

      - name: "Upload APK ke GitHub Releases"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "Nusopa Mart APK v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 🎉 APK Sukses Dibuat Otomatis Tanpa Folder Android Lokal!
            
            Silakan unduh file `app-release.apk` di bawah untuk mencoba aplikasi di HP Android Anda.
            
            **Detail Pengaman:**
            - Folder Android dirakit otomatis di Server Ubuntu GitHub (100% Bersih dari Error Cache Lokal).
            - Sinkronisasi Logo Ikon Sukses Diinjeksikan ke Manifest.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
