name: Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project
        run: |
          if [ ! -f android/settings.gradle.kts ] && [ ! -f android/settings.gradle ]; then
            flutter create --platforms=android --project-name nusopa_mart .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Apply safe Dart fixes
        run: dart fix --apply

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
