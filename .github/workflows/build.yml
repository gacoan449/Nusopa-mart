name: Rakit Otomatis APK Nusopa Mart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil seluruh kode dari repositori GitHub Anda
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      # 2. Memasang bahasa pemrograman Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Memasang Mesin Flutter ke server cloud GitHub
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      # 4. Membuat kerangka folder Android asli di memori server
      - name: Buat Paksa Kerangka Folder Android Native
        run: flutter create . --platforms=android --project-name=nusopa_mart

      # 5. AMANKAN SUARA: Membuat folder assets/suara & file mp3 kosong otomatis agar pubspec tidak eror
      - name: Amankan Aset Folder Suara
        run: |
          mkdir -p assets/suara
          touch assets/suara/nusopa_sound.mp3

      # 6. FIX KOTLIN UTAMAKAN ROOT (OVERWRITE GRADLE): Menimpa paksa berkas build.gradle root dengan Kotlin 1.9.0
      - name: Suntik Paksa Versi Kotlin Terupdate
        run: |
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # Melakukan suntikan versi Kotlin 1.9.0 langsung ke settings.gradle tingkat atas
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  def file = new File(rootRootDir, "local.properties")
                  if (file.exists()) {
                      properties.load(file.newDataInputStream())
                  }
                  def sdkPath = properties.getProperty("flutter.sdk")
                  assert sdkPath != null, "flutter.sdk not set in local.properties"
                  return sdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
          }

          plugins {
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.0" apply false // PAKSA KOTLIN BARU DI SINI
          }

          include ":app"
          EOF

          # Tulis ulang build.gradle aplikasi dengan target SDK 34 stabil
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.nusopa.mart"
              compileSdkVersion 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.nusopa.mart"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 1           
                  versionName "1.0.0"     
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

      # 7. Mengunduh semua pustaka yang tertulis di pubspec.yaml Anda
      - name: Install Pustaka (Dependencies)
        run: flutter pub get

      # 8. Memicu robot pembangun untuk memotong logo.png menjadi ikon aplikasi Android resmi
      - name: Cetak Logo Ikon Aplikasi Otomatis
        run: flutter pub run flutter_launcher_icons

      # 9. Proses utama merakit aplikasi menjadi file APK siap instal
      - name: Proses Perakitan APK (Build Release)
        run: flutter build apk --release --no-tree-shake-icons

      # 10. Memanen hasil rakitan dan memajangnya di halaman GitHub agar bisa Anda unduh
      - name: Upload File APK Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
