name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # LANGKAH FORCE/PAKSA: Membuat folder android dan langsung memaksa Kotlin menggunakan versi terbaru biar tidak bentrok
    - name: Auto Generate Android with Custom Kotlin
      run: |
        flutter create . --platforms=android
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' android/build.gradle

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
