name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # PERBAIKAN URUTAN SAKTI: Jalankan flutter create DULUAN, baru amankan setelan Gradle-nya
    - name: Auto Generate Android Platform Base
      run: |
        flutter create . --platforms=android
        
        # Suntik Kotlin versi stabil ke Gradle utama (.kts)
        sed -i 's/id("org.jetbrains.kotlin.android") version ".*/id("org.jetbrains.kotlin.android") version "1.9.22" apply false/' android/build.gradle.kts

    # LANGKAH PENYELAMATAN: Ambil kembali (Force Checkout) file main.dart asli milik Anda dari GitHub agar tidak hilang tertimpa
    - name: Restore Original Source Code
      run: |
        git checkout HEAD -- lib/main.dart

    # SELESAIKAN INTEGRASI GRADLE APP UTAMA 
    - name: Inject Custom Gradle Config
      run: |
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.example.nusopa_mart"
            compileSdk = 36

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
                isCoreLibraryDesugaringEnabled = true
            }

            defaultConfig {
                applicationId = "com.example.nusopa_mart"
                minSdk = 21
                targetSdk = 36
                versionCode = flutter.versionCode
                versionName = flutter.versionName
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        kotlin {
            jvmToolchain(17)
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
        }
        EOF

        # SAPU JAGAT MASSAL PLUGIN LUAR
        cat << 'EOF' >> android/build.gradle.kts
        subprojects {
            plugins.withType<com.android.build.gradle.api.AndroidBasePlugin> {
                configure<com.android.build.gradle.BaseExtension> {
                    compileSdkVersion(36)
                    defaultConfig {
                        targetSdkVersion(36)
                    }
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
