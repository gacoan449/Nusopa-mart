name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3

      - name: Validate Flutter source
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Generate Android platform in cloud
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --project-name nusopa_mart .
          test -f android/settings.gradle -o -f android/settings.gradle.kts

      - name: Create and verify ephemeral local.properties
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd -P)"
          test -d "$FLUTTER_ROOT/packages/flutter_tools"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR"

          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$SDK_DIR" > android/local.properties

          test -s android/local.properties
          test -f android/local.properties
          grep -qx "flutter.sdk=$FLUTTER_ROOT" android/local.properties
          grep -qx "sdk.dir=$SDK_DIR" android/local.properties

          echo "=== local.properties ==="
          cat android/local.properties

      - name: Diagnose generated Android configuration
        shell: bash
        run: |
          set -euo pipefail
          ls -la android
          test -f android/local.properties
          ls -l android/local.properties
          if [ -f android/settings.gradle ]; then
            sed -n '1,40p' android/settings.gradle
          fi

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
