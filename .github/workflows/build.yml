name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # STRATEGI BACKUP INTERN: Mengamankan file main.dart asli Anda sebelum dihancurkan Flutter CLI
    - name: Auto Generate Android with Safe File Backup
      run: |
        # 1. Amankan file main.dart asli Anda ke folder temporary di luar proyek
        mkdir -p /tmp/nusopa_backup
        if [ -f "lib/main.dart" ]; then
          cp lib/main.dart /tmp/nusopa_backup/main.dart
        elif [ -f "main.dart" ]; then
          cp main.dart /tmp/nusopa_backup/main.dart
        fi
        
        # 2. Buat folder platform android (proses ini akan menimpa main.dart sampel bawaan)
        flutter create . --platforms=android
        
        # 3. KEMBALIKAN MUTLAK file main.dart asli Anda dari folder temporary
        if [ -f "/tmp/nusopa_backup/main.dart" ]; then
          cp /tmp/nusopa_backup/main.dart lib/main.dart
        fi
        
        # 4. Suntik plugin Kotlin versi stabil ke Gradle utama (.kts)
        sed -i 's/id("org.jetbrains.kotlin.android") version ".*/id("org.jetbrains.kotlin.android") version "1.9.22" apply false/' android/build.gradle.kts

    # SELESAIKAN INTEGRASI GRADLE APP UTAMA 
    - name: Inject Custom Gradle Config
      run: |
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.example.nusopa_mart"
            compileSdk = 36

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
                isCoreLibraryDesugaringEnabled = true
            }

            defaultConfig {
                applicationId = "com.example.nusopa_mart"
                minSdk = 21
                targetSdk = 36
                versionCode = flutter.versionCode
                versionName = flutter.versionName
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        kotlin {
            jvmToolchain(17)
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
        }
        EOF

        # SAPU JAGAT MASSAL PLUGIN LUAR KTS
        cat << 'EOF' >> android/build.gradle.kts
        subprojects {
            plugins.withType<com.android.build.gradle.api.AndroidBasePlugin> {
                configure<com.android.build.gradle.BaseExtension> {
                    compileSdkVersion(36)
                    defaultConfig {
                        targetSdkVersion(36)
                    }
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
