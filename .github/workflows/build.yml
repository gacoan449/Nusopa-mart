name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Validate Flutter source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      # Bootstrap Android dan local.properties dalam satu step sebelum Gradle.
      - name: Generate Android platform and local.properties
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --project-name nusopa_mart .

          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd -P)"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -d "$FLUTTER_ROOT/packages/flutter_tools"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR"

          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$SDK_DIR" > android/local.properties

          echo "=== REQUIRED FILES BEFORE BUILD ==="
          test -f android/settings.gradle -o -f android/settings.gradle.kts
          test -s android/local.properties
          ls -l android/local.properties
          cat android/local.properties

      # Tidak ada clean atau penghapusan android setelah file dibuat.
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/local.properties
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14