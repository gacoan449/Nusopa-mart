name: Build Flutter App Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.44.7'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  GRADLE_VERSION: '8.11.1'

jobs:
  build-appbundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ env.JAVA_VERSION }}'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '${{ env.FLUTTER_VERSION }}'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/google-services.json
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/Nusopa/mart/MainActivity.kt
          grep -q 'dev.flutter.flutter-plugin-loader' android/settings.gradle
          grep -q 'dev.flutter.flutter-gradle-plugin' android/app/build.gradle
          grep -q 'applicationId "Nusopa.mart"' android/app/build.gradle
          grep -q 'namespace "Nusopa.mart"' android/app/build.gradle
          grep -q 'compileSdk 36' android/app/build.gradle
          grep -q 'targetSdk 36' android/app/build.gradle
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle
          grep -q '"package_name": "Nusopa.mart"' android/app/google-services.json

      - name: Generate CI local.properties
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd -P)"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$FLUTTER_ROOT/packages/flutter_tools"
          test -d "$SDK_DIR"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$SDK_DIR" > android/local.properties
          test -s android/local.properties
          echo "local.properties generated successfully"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type all
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Gradle toolchain
        working-directory: android
        run: ./gradlew --version

      - name: Verify Android framework resources
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          PLATFORM="$SDK_DIR/platforms/android-${ANDROID_API_LEVEL}"
          test -d "$PLATFORM"
          test -s "$PLATFORM/android.jar"
          echo "Using Android platform: $PLATFORM"
          ls -lh "$PLATFORM/android.jar"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build App Bundle Release
        working-directory: android
        run: ./gradlew :app:bundleRelease

      - name: Locate and Sync App Bundle Output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/app/outputs/bundle/release
          FOUND_AAB="$(find . -type f -name "*.aab" | head -n 1)"
          if [ -z "$FOUND_AAB" ]; then
            echo "Error: File .aab tidak ditemukan!"
            exit 1
          fi
          echo "Ditemukan AAB pada: $FOUND_AAB"
          cp "$FOUND_AAB" build/app/outputs/bundle/release/app-release.aab

      - name: Verify App Bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          ls -lh "$AAB"
          sha256sum "$AAB"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build APK Release (Untuk Tes di HP)
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Locate and Sync APK Output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/app/outputs/apk/release
          FOUND_APK="$(find . -type f -name "*release.apk" -not -name "*unaligned*" | head -n 1)"
          if [ -z "$FOUND_APK" ]; then
            echo "Error: File .apk tidak ditemukan!"
            exit 1
          fi
          echo "Ditemukan APK pada: $FOUND_APK"
          cp "$FOUND_APK" build/app/outputs/apk/release/app-release.apk

      - name: Upload APK For Testing
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-testing-apk
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
