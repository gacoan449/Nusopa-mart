name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # REVISI PAMUNGKAS: Menyelaraskan Target JVM Java dan Kotlin menggunakan sistem Toolchain 17 Resmi
    - name: Auto Generate Android and Inject Custom Gradle Config
      run: |
        flutter create . --platforms=android
        
        # 1. Sembuhin baris sample main.dart bawaan Flutter CLI yang rusak titik eksperimental
        sed -i 's/colorScheme: .fromSeed/colorScheme: ColorScheme.fromSeed/g' lib/main.dart
        sed -i 's/mainAxisAlignment: .center/mainAxisAlignment: MainAxisAlignment.center/g' lib/main.dart
        
        # 2. Suntik Kotlin versi stabil ke Gradle utama (.kts)
        sed -i 's/id("org.jetbrains.kotlin.android") version ".*/id("org.jetbrains.kotlin.android") version "1.9.22" apply false/' android/build.gradle.kts
        
        # 3. KUNCI TOTAL SDK 36 & JAVA COMPATIBILITY 17
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.example.nusopa_mart"
            compileSdk = 36

            // REVISI KUNCI: Menyelaraskan kompilasi Java ke versi 17 agar sejalan dengan Kotlin
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
                isCoreLibraryDesugaringEnabled = true
            }

            defaultConfig {
                applicationId = "com.example.nusopa_mart"
                minSdk = 21
                targetSdk = 36
                versionCode = flutter.versionCode
                versionName = flutter.versionName
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        // REVISI KUNCI: Memaksa compiler Kotlin menggunakan jalur Toolchain 17 biar sinkron 100%
        kotlin {
            jvmToolchain(17)
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
        }
        EOF

        # 4. SAPU JAGAT MASSAL: Memaksa semua sub-project/plugin luar ikut naik kelas ke SDK 36 otomatis
        cat << 'EOF' >> android/build.gradle.kts
        subprojects {
            plugins.withType<com.android.build.gradle.api.AndroidBasePlugin> {
                configure<com.android.build.gradle.BaseExtension> {
                    compileSdkVersion(36)
                    defaultConfig {
                        targetSdkVersion(36)
                    }
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
