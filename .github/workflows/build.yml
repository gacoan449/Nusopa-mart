name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Flutter source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source validated."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      # Repository tetap zero-android-folder.
      # Platform Android dibuat hanya di runner sementara dan tidak di-commit.
      - name: Generate Android platform in cloud
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --project-name nusopa_mart .
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusopa-mart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
