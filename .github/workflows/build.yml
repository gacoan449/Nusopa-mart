name: Rakit Otomatis APK Nusopa Mart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil seluruh kode dari repositori GitHub Anda
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      # 2. Memasang bahasa pemrograman Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Memasang Mesin Flutter ke server cloud GitHub
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      # 4. Membuat kerangka folder Android asli bawaan pabrik Flutter
      - name: Buat Paksa Kerangka Folder Android Native
        run: flutter create . --platforms=android --project-name=nusopa_mart

      # 5. AMANKAN SUARA: Membuat folder assets/suara & file mp3 kosong otomatis agar pubspec tidak eror
      - name: Amankan Aset Folder Suara
        run: |
          mkdir -p assets/suara
          touch assets/suara/nusopa_sound.mp3

      # 6. SUNTIKAN JITU (TEXT OVERWRITE): Menyisipkan paksa versi Kotlin 1.9.0 ke berkas internal pabrik
      - name: Suntik Paksa Versi Kotlin Terupdate
        run: |
          cat << 'EOF' > android/build.gradle
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      # 7. KUNCI KEMENANGAN (MANIFEST OVERRIDE): Mengganti isi AndroidManifest.xml dengan hak paksa agar Firebase Auth lolos dari minSdk 21
      - name: Paksa Lolos Izin Manifest Android
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com"
              package="com.nusopa.mart">
              
              <uses-sdk tools:overrideLibrary="com.google.firebase.auth, com.google.firebase.auth.internal, io.flutter.plugins.firebase.auth"/>
              
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="Nusopa Mart"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|locale|layoutDirection|fontScale|screenHeight|menu|density"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      # 8. Mengunduh semua pustaka yang tertulis di pubspec.yaml Anda
      - name: Install Pustaka (Dependencies)
        run: flutter pub get

      # 9. Memicu robot pembangun untuk memotong logo.png menjadi ikon aplikasi Android resmi
      - name: Cetak Logo Ikon Aplikasi Otomatis
        run: flutter pub run flutter_launcher_icons

      # 10. Proses utama merakit aplikasi menjadi file APK siap instal
      - name: Proses Perakitan APK (Build Release)
        run: flutter build apk --release --no-tree-shake-icons

      # 11. Memanen hasil rakitan dan memajangnya di halaman GitHub agar bisa Anda unduh
      - name: Upload File APK Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: Nusopa-Mart-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
