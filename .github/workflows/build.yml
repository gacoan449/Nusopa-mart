name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # EKSEKUSI PENYELAMATAN: Memaksa mengubah folder Lib (Huruf Besar) menjadi lib (Huruf Kecil) agar dikenali Flutter!
    - name: Fix Folder Case Sensitivity
      run: |
        if [ -d "Lib" ]; then
          mv Lib lib
        fi

    # JALUR AMAN: Menyiapkan kelengkapan folder android resmi milik Anda ke target SDK 36 + Desugaring Java 8
    - name: Inject Custom Android Configurations
      run: |
        flutter create . --platforms=android
        
        # Sembuhin baris main.dart asli Anda dari racun titik eksperimental dot-shorthands jika masih ada
        sed -i 's/colorScheme: .fromSeed/colorScheme: ColorScheme.fromSeed/g' lib/main.dart
        sed -i 's/mainAxisAlignment: .center/mainAxisAlignment: MainAxisAlignment.center/g' lib/main.dart
        
        # Suntik Kotlin versi stabil ke Gradle utama (.kts)
        sed -i 's/id("org.jetbrains.kotlin.android") version ".*/id("org.jetbrains.kotlin.android") version "1.9.22" apply false/' android/build.gradle.kts
        
        # Mengaktifkan desugaring Java 8 otomatis untuk paket notifikasi
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.example.nusopa_mart"
            compileSdk = 36

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
                isCoreLibraryDesugaringEnabled = true
            }

            defaultConfig {
                applicationId = "com.example.nusopa_mart"
                minSdk = 21
                targetSdk = 36
                versionCode = flutter.versionCode
                versionName = flutter.versionName
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        kotlin {
            jvmToolchain(17)
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
        }
        EOF

        # Menyelaraskan seluruh plugin luar ke Android SDK 36 agar geolocator, image_picker, dll tidak bentrok
        cat << 'EOF' > android/build.gradle.kts
        subprojects {
            plugins.withType<com.android.build.gradle.api.AndroidBasePlugin> {
                configure<com.android.build.gradle.BaseExtension> {
                    compileSdkVersion(36)
                    defaultConfig {
                        targetSdkVersion(36)
                    }
                }
            }
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
