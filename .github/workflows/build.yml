name: Flutter Build APK Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # REVISI FINAL MUTLAK: Menyamakan Target JVM menggunakan sistem Toolchain 17 resmi rekomendasi Google
    - name: Auto Generate Android and Inject Custom Gradle Config
      run: |
        flutter create . --platforms=android
        
        # 1. Membuat folder suara kosong di server biar tidak eror assets
        mkdir -p assets/suara
        touch assets/suara/.gitkeep
        
        # 2. Sembuhin baris sample main.dart bawaan Flutter CLI yang rusak titik eksperimental
        sed -i 's/colorScheme: .fromSeed/colorScheme: ColorScheme.fromSeed/g' lib/main.dart
        sed -i 's/mainAxisAlignment: .center/mainAxisAlignment: MainAxisAlignment.center/g' lib/main.dart
        
        # 3. Suntik Kotlin versi stabil ke Gradle utama
        sed -i 's/id("org.jetbrains.kotlin.android") version ".*/id("org.jetbrains.kotlin.android") version "1.9.22" apply false/' android/build.gradle.kts
        
        # 4. KUNCI TOOLCHAIN 17: Menyamakan target Java dan Kotlin ke versi 17 secara otomatis dan sah
        cat << 'EOF' > android/app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
        }

        android {
            namespace = "com.example.nusopa_mart"
            compileSdk = flutter.compileSdkVersion

            // SOLUSI MUTLAK: Menyelaraskan tugas Java dan Kotlin ke satu komando JDK 17
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
                isCoreLibraryDesugaringEnabled = true
            }

            defaultConfig {
                applicationId = "com.example.nusopa_mart"
                minSdk = 21
                targetSdk = flutter.targetSdkVersion
                versionCode = flutter.versionCode
                versionName = flutter.versionName
                multiDexEnabled = true
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        // PAKSA KOTLIN MENGGUNAKAN JALUR TOOLCHAIN JAVA 17 AGAR SINKRON 100%
        kotlin {
            jvmToolchain(17)
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
        }
        EOF

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
