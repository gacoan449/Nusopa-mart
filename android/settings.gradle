pluginManagement {
    // GitHub Actions (dan beberapa CI lain) menyediakan FLUTTER_ROOT.
    // Gunakan environment variable terlebih dahulu agar build tidak bergantung
    // pada local.properties yang hanya ada di mesin developer.
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")

    if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
        def properties = new Properties()
        def localProperties = file("local.properties")

        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
            flutterSdkPath = properties.getProperty("flutter.sdk")
        }
    }

    assert flutterSdkPath != null && !flutterSdkPath.trim().isEmpty(), "Flutter SDK path tidak ditemukan. Set FLUTTER_ROOT atau buat android/local.properties dengan flutter.sdk."

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Nusopa-mart"
include ":app"
