plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "Nusopa.mart"
    // Diperbarui ke 36 untuk mendukung plugin terbaru Anda
    compileSdk 36
    // Menambahkan kecocokan NDK yang diminta oleh plugin jni
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "Nusopa.mart"
        minSdk 24
        // Diperbarui ke 36 agar selaras dengan versi SDK kompilasi
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    // Samakan target JVM Java dan Kotlin ke Java 17.
    // Ini memperbaiki error karena Java sebelumnya ditargetkan ke 1.8
    // sementara Kotlin ditargetkan ke JVM 17.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Release build dibuat eksplisit non-minified untuk mengisolasi
    // kegagalan R8/ProGuard tanpa mengubah konfigurasi debug.
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
