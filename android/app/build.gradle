plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.nusopa_mart'
    compileSdk 35

    defaultConfig {
        // Must exactly match an Android client registered in Firebase.
        applicationId 'com.example.desapay'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
