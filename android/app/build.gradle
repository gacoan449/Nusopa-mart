plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "Nusopa.mart"
    // Diperbarui ke 36 untuk mendukung plugin terbaru Anda
    compileSdk 36
    // Menambahkan kecocokan NDK yang diminta oleh plugin jni
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "Nusopa.mart"
        minSdk 23
        // Diperbarui ke 36 agar selaras dengan versi SDK kompilasi
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
}

flutter {
    source "../.."
}
