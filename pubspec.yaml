name: Nusopa-mart
description: "Aplikasi Marketplace Multi-Vendor Sederhana Kelas Tunggal Berbasis Tiket"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- PUSTAKA INTI FIREBASE ---
  firebase_core: ^3.0.0          # Inisialisasi awal koneksi Firebase cloud
  firebase_auth: ^5.0.0          # Sistem keamanan daftar & login user/seller
  cloud_firestore: ^5.0.0        # Database realtime produk, pesanan, dan tiket

  # --- FITUR VISUAL & OPERASIONAL MARKETPLACE ---
  image_picker: ^1.1.2           # Mengambil foto dagangan dari galeri HP seller
  firebase_storage: ^12.0.0      # Tempat menyimpan file gambar produk di cloud
  carousel_slider_plus: ^1.0.2   # Spanduk banner promo bergerak otomatis biar ramai
  url_launcher: ^6.3.0           # Membuka link cekresi luar secara otomatis

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
