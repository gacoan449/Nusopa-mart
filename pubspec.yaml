name: Nusopa_mart
description: "Aplikasi Marketplace Multi-Vendor Sederhana Kelas Tunggal Berbasis Tiket"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- PUSTAKA INTI FIREBASE ---
  firebase_core: ^3.0.0          # Inisialisasi awal koneksi Firebase cloud
  firebase_auth: ^5.0.0          # Sistem keamanan daftar & login user/seller
  cloud_firestore: ^5.0.0        # Database realtime produk, pesanan, dan tiket

  # --- FITUR VISUAL & OPERASIONAL MARKETPLACE ---
  image_picker: ^1.1.2           # Mengambil foto dagangan dari galeri HP seller
  firebase_storage: ^12.0.0      # Tempat menyimpan file gambar produk di cloud
  carousel_slider_plus: ^1.0.2   # Spanduk banner promo bergerak otomatis biar ramai
  url_launcher: ^6.3.0           # Membuka link cekresi luar secara otomatis

  # --- FITUR SISTEM LOKASI & RADIAL MAPS ---
  geolocator: ^13.0.2            # Mengambil titik koordinat GPS untuk filter toko terdekat

  # --- FITUR SISTEM NOTIFIKASI SUARA KHUSUS ---
  firebase_messaging: ^15.0.0          # Menerima sinyal push notification iklan & orderan
  flutter_local_notifications: ^17.2.1 # Menampilkan pop-up notifikasi + pemicu suara khas

  # --- PEMUTAR SUARA JALUR CODING DART (LIB) ---
  audioplayers: ^6.0.0          # Memutar suara notifikasi lewat folder assets asli

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1     # Robot pembangun ikon logo aplikasi otomatis

# --- KONFIGURASI CETAK LOGO IKON APLIKASI (SHRINK-TO-FIT) ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"            # Jalur berkas gambar logo Anda di GitHub
  adaptive_icon_background: "#FFFFFF"          # Warna latar belakang dasar cetakan logo
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  
  # Mendaftarkan folder aset agar terbaca penuh oleh sistem kompilasi Flutter
  assets:
    - assets/icon/
    - assets/suara/             # KUNCI: Mendaftarkan folder suara kustom Anda
