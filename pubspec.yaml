name: nusopa_mart
description: "Aplikasi Marketplace Multi-Vendor Sederhana Kelas Tunggal Berbasis Tiket"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- PUSTAKA INTI FIREBASE ---
  firebase_core: ^3.0.0          
  firebase_auth: ^5.0.0          
  cloud_firestore: ^5.0.0        

  # --- FITUR VISUAL & OPERASIONAL MARKETPLACE ---
  image_picker: ^1.1.2           
  firebase_storage: ^12.0.0      
  carousel_slider_plus: ^7.1.2   
  url_launcher: ^6.3.0           

  # --- FITUR SISTEM LOKASI & RADIAL MAPS ---
  geolocator: ^13.0.2            

  # --- FITUR SISTEM NOTIFIKASI STANDAR ---
  firebase_messaging: ^15.0.0          
  flutter_local_notifications: ^17.2.1 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1     

# --- PERBAIKAN UTAMA: Konfigurasi Cetak Ikon Disinkronkan ke Sistem Android ---
flutter_launcher_icons:
  android: true                          # DIUBAH MENJADI TRUE agar resmi menimpa logo bawaan (ic_launcher)
  ios: false                             
  image_path: "assets/icon/logo.png"            
  adaptive_icon_background: "#FFFFFF"          
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  
  # Mendaftarkan folder aset gambar agar terbaca penuh saat proses kompilasi APK
  assets:
    - assets/icon/
